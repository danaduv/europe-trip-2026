async function sheetsGet(key) {
  try {
    const res = await fetch(`${SHEETS_URL}?action=get&key=${encodeURIComponent(key)}`, { redirect: "follow" });
    const data = await res.json();
    return data.ok && data.value ? { value: data.value } : null;
  } catch(e) { return null; }
}

async function sheetsSet(key, value) {
  try {
    await fetch(SHEETS_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain" },
      body: JSON.stringify({ action: "set", key, value }),
    });
  } catch(e) {}
}

function generateId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2);
}

function fmt12(t) {
  if (!t) return "";
  const [h, m] = t.split(":").map(Number);
  const ampm = h >= 12 ? "pm" : "am";
  const h12 = h % 12 || 12;
  return `${h12}:${String(m).padStart(2,"0")}${ampm}`;
}

function formatDate(dateStr) {
  if (!dateStr) return "";
  const d = new Date(dateStr + "T00:00:00");
  return d.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
}

function groupByDate(items) {
  const groups = {};
  items.forEach(item => {
    const key = item.date || "No Date";
    if (!groups[key]) groups[key] = [];
    groups[key].push(item);
    // For hotels/airbnbs with an end date, also show on the end date
    if (item.endDate && item.endDate !== item.date && (item.category === "hotel" || item.category === "airbnb")) {
      if (!groups[item.endDate]) groups[item.endDate] = [];
      groups[item.endDate].push({ ...item, _isCheckout: true });
    }
  });
  return Object.entries(groups).sort(([a], [b]) => {
    if (a === "No Date") return 1;
    if (b === "No Date") return -1;
    return a.localeCompare(b);
  });
}

function Modal({ isOpen, onClose, children }) {
  useEffect(() => {
    if (isOpen) document.body.style.overflow = "hidden";
    else document.body.style.overflow = "";
    return () => { document.body.style.overflow = ""; };
  }, [isOpen]);

  if (!isOpen) return null;
  return (
    <div style={{
      position: "fixed", inset: 0, zIndex: 1000,
      background: "rgba(0,0,0,0.45)", display: "flex",
      alignItems: "center", justifyContent: "center", padding: "1rem",
    }} onClick={onClose}>
      <div onClick={e => e.stopPropagation()} style={{
        background: "#fff", borderRadius: 16, width: "100%", maxWidth: 560,
        maxHeight: "90vh", overflowY: "auto", boxShadow: "0 24px 64px rgba(0,0,0,0.18)",
      }}>
        {children}
      </div>
    </div>
  );
}

            <div style={{ marginTop: 10 }}>
              <span style={{ fontSize: 11, fontWeight: 600, textTransform: "uppercase", letterSpacing: "0.08em", color: "#888" }}>Status: </span>
              <span style={{ fontSize: 12, color: statusColor, fontWeight: 600 }}>{statusLabel}</span>
            </div>
          )}
          {item.confirmationCode && (
            <div style={{ marginTop: 10 }}>
              <span style={{ fontSize: 11, fontWeight: 600, textTransform: "uppercase", letterSpacing: "0.08em", color: "#888" }}>Booking ref: </span>
              <span style={{ fontFamily: "monospace", fontSize: 13, color: "#1a6fc4", fontWeight: 600 }}>{item.confirmationCode}</span>
            </div>
          )}
          {item.notes && (
            <div style={{ marginTop: 8, fontSize: 13, color: "#555", lineHeight: 1.6 }}>{item.notes}</div>
          )}
        </div>
      )}
    </div>
  );
}

function TripSummary({ items, tripName, startDate, endDate }) {
  const totalByCurrency = {};
  items.forEach(item => {
    if (item.cost && parseFloat(item.cost) > 0) {
      const c = item.currency || "EUR";
      totalByCurrency[c] = (totalByCurrency[c] || 0) + parseFloat(item.cost);
    }
  });

  const byCat = {};
  items.forEach(item => {
    byCat[item.category] = (byCat[item.category] || 0) + 1;
  });

  const days = startDate && endDate
    ? Math.ceil((new Date(endDate) - new Date(startDate)) / (1000 * 60 * 60 * 24)) + 1
    : null;

  return (
    <div style={{
      background: "linear-gradient(135deg, #1a1916 0%, #2d2b27 100%)",
      borderRadius: 16, padding: "1.5rem", marginBottom: "1.5rem", color: "#f5f2ec",
    }}>
      <div style={{ fontFamily: "'Playfair Display', Georgia, serif", fontSize: 22, marginBottom: 4 }}>
        {tripName || "My Europe Trip"}
      </div>
      {startDate && endDate && (
        <div style={{ fontSize: 13, color: "#a09a8a", marginBottom: "1rem" }}>
          {formatDate(startDate)} → {formatDate(endDate)} · {days} day{days !== 1 ? "s" : ""}
        </div>
      )}
      {(!startDate || !endDate) && <div style={{ fontSize: 13, color: "#a09a8a", marginBottom: "1rem" }}>{items.length} items planned</div>}

      <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginBottom: "1rem" }}>
        {Object.entries(byCat).map(([cat, count]) => {
          const cfg = CATEGORY_CONFIG[cat] || CATEGORY_CONFIG.other;
          return (
            <div key={cat} style={{
              background: "rgba(255,255,255,0.1)", borderRadius: 20,
              padding: "4px 12px", fontSize: 13, display: "flex", alignItems: "center", gap: 5,
            }}>
              {cfg.icon} <span>{count} {cfg.label}{count !== 1 ? "s" : ""}</span>
            </div>
          );
        })}
      </div>

      {Object.keys(totalByCurrency).length > 0 && (
        <div style={{ borderTop: "1px solid rgba(255,255,255,0.1)", paddingTop: "1rem" }}>
          <div style={{ fontSize: 11, textTransform: "uppercase", letterSpacing: "0.08em", color: "#a09a8a", marginBottom: 6 }}>Total Spent</div>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 12 }}>
            {Object.entries(totalByCurrency).map(([cur, amt]) => (
              <div key={cur}>
                <span style={{ fontSize: 20, fontFamily: "'Playfair Display', Georgia, serif" }}>
                  {amt.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}
                </span>
                <span style={{ fontSize: 12, color: "#a09a8a", marginLeft: 4 }}>{cur}</span>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}


function CollapsibleDay({ dateKey, dayItems, onEdit, onDelete }) {
  const [open, setOpen] = useState(true);
  return (
    <div style={{ marginBottom: "1rem" }}>
      <button onClick={() => setOpen(o => !o)} style={{
        display: "flex", alignItems: "center", gap: 8, marginBottom: open ? 8 : 0,
        background: "none", border: "none", cursor: "pointer", padding: 0, width: "100%", textAlign: "left",
      }}>
        <div style={{
          background: "#1a1916", color: "#f5f2ec", borderRadius: 8,
          padding: "4px 12px", fontSize: 12,
          fontFamily: "'Playfair Display', Georgia, serif",
          whiteSpace: "nowrap",
        }}>
          {dateKey === "No Date" ? "No Date" : formatDate(dateKey)}
        </div>
        <span style={{ fontSize: 11, color: "#aaa", marginLeft: 2 }}>{open ? "▾" : "▸"}</span>
      </button>
      {open && (
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          {dayItems
            .sort((a, b) => (a.startTime || "").localeCompare(b.startTime || ""))
            .map(item => (
              <ItineraryItem key={item._isCheckout ? item.id + "-checkout" : item.id} item={item} onEdit={onEdit} onDelete={onDelete} />
            ))}
        </div>
      )}
    </div>
  );
}

function EuropeTripPlanner() {
  const [items, setItems] = useState([]);
  const [tripName, setTripName] = useState("Europe June 2026");
  const [startDate, setStartDate] = useState("");
  const [endDate, setEndDate] = useState("");
  const [modalOpen, setModalOpen] = useState(false);
  const [editingItem, setEditingItem] = useState(null);
  const [filters, setFilters] = useState(new Set());
  const [loaded, setLoaded] = useState(false);
  const [view, setView] = useState("timeline"); // timeline | list
  const [search, setSearch] = useState("");
  const [syncing, setSyncing] = useState(false);

  const loadFromSheets = useCallback(async () => {
    setSyncing(true);
    try {
      const r = await sheetsGet("trip-data");
      if (r && r.value) {
        const data = JSON.parse(r.value);
        const existing = data.items || [];
        const existingIds = new Set(existing.map(i => i.id));
        const merged = [...existing.map(i => /^(f1|f2|tr)-/.test(i.id) ? { ...i, status: "" } : i), ...SEED_EVENTS.filter(e => !existingIds.has(e.id))];
        setItems(merged);
        setTripName(data.tripName || "Europe June 2026");
        setStartDate(data.startDate || "2026-06-03");
        setEndDate(data.endDate || "2026-06-17");
        try { await sheetsSet("trip-data", JSON.stringify({ items: merged, tripName: data.tripName || "Europe June 2026", startDate: data.startDate || "2026-06-03", endDate: data.endDate || "2026-06-17" })); } catch(_) {}
      } else {
        setItems(SEED_EVENTS);
        setTripName("Europe June 2026");
        setStartDate("2026-06-03");
        setEndDate("2026-06-17");
        try { await sheetsSet("trip-data", JSON.stringify({ items: SEED_EVENTS, tripName: "Europe June 2026", startDate: "2026-06-03", endDate: "2026-06-17" })); } catch(_) {}
      }
    } catch (e) {
      setItems(SEED_EVENTS);
      setTripName("Europe June 2026");
      setStartDate("2026-06-03");
      setEndDate("2026-06-17");
    } finally {
      setLoaded(true);
      setSyncing(false);
    }
  }, []);

  // Load on mount
  useEffect(() => { loadFromSheets(); }, [loadFromSheets]);

  // Refresh when tab becomes visible
  useEffect(() => {
    const onVisible = () => { if (document.visibilityState === "visible") loadFromSheets(); };
    document.addEventListener("visibilitychange", onVisible);
    return () => document.removeEventListener("visibilitychange", onVisible);
  }, [loadFromSheets]);

  // Save to storage
  const save = useCallback(async (newItems, name, sd, ed) => {
    try {
      const r = await sheetsGet("trip-data");
      const existing = r && r.value ? JSON.parse(r.value) : {};
      const deletedIds = existing.deletedIds || [];
      await sheetsSet("trip-data", JSON.stringify({ items: newItems, deletedIds, tripName: name, startDate: sd, endDate: ed }));
    } catch (e) {}
  }, []);

  const updateItems = (newItems) => {
    setItems(newItems);
    save(newItems, tripName, startDate, endDate);
  };

  const handleSave = (item) => {
    let newItems;
    if (items.find(i => i.id === item.id)) {
      newItems = items.map(i => i.id === item.id ? item : i);
    } else {
      newItems = [...items, item];
    }
    updateItems(newItems);
    setModalOpen(false);
    setEditingItem(null);
  };

  const handleDelete = (id) => {
    if (confirm("Remove this item?")) {
      const newItems = items.filter(i => i.id !== id);
      setItems(newItems);
      // Load current deletedIds from sheets and append
      sheetsGet("trip-data").then(r => {
        const data = r && r.value ? JSON.parse(r.value) : {};
        const deletedIds = [...new Set([...(data.deletedIds || []), id])];
        sheetsSet("trip-data", JSON.stringify({ ...data, items: newItems, deletedIds }));
      }).catch(() => {
        sheetsSet("trip-data", JSON.stringify({ items: newItems, deletedIds: [id], tripName, startDate, endDate }));
      });
    }
  };

  const handleEdit = (item) => {
    setEditingItem(item);
    setModalOpen(true);
  };


  const handleTripMeta = (field, val) => {
    const updates = { tripName, startDate, endDate, [field]: val };
    if (field === "tripName") setTripName(val);
    if (field === "startDate") setStartDate(val);
    if (field === "endDate") setEndDate(val);
    save(items, updates.tripName, updates.startDate, updates.endDate);
  };

  const filteredItems = items.filter(item => {
    if (filters.size > 0 && !filters.has(item.category)) return false;
    if (search && !item.title.toLowerCase().includes(search.toLowerCase()) &&
        !item.location.toLowerCase().includes(search.toLowerCase())) return false;
    return true;
  });

  const grouped = groupByDate(filteredItems);

  if (!loaded) return (
    <div style={{ padding: "3rem", textAlign: "center", fontFamily: "Georgia, serif", color: "#888" }}>
      Loading your trip…
    </div>
  );

  return (
    <div style={{
      maxWidth: 720, margin: "0 auto", padding: "1.5rem 1rem 4rem",
      fontFamily: "Georgia, serif", color: "#1a1916", background: "#faf9f6", minHeight: "100vh",
    }}>
      <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;700&display=swap" rel="stylesheet" />

      <TripSummary items={items} tripName={tripName} startDate={startDate} endDate={endDate} />


      {/* Controls */}
      <div style={{ display: "flex", gap: 10, marginBottom: "1rem", flexWrap: "wrap", alignItems: "center" }}>
        <input
          value={search}
          onChange={e => setSearch(e.target.value)}
          placeholder="Search…"
          style={{
            flex: "1 1 140px", padding: "8px 12px", border: "1px solid #e2e0d8",
            borderRadius: 8, fontSize: 13, fontFamily: "Georgia, serif", background: "#fff", color: "#1a1916", outline: "none",
          }}
        />
        <button onClick={loadFromSheets} disabled={syncing} style={{
          padding: "8px 14px", borderRadius: 8, border: "1px solid #e2e0d8",
          background: "#fff", color: syncing ? "#bbb" : "#555", cursor: syncing ? "default" : "pointer",
          fontSize: 13, fontFamily: "Georgia, serif", whiteSpace: "nowrap",
        }}>
          {syncing ? "Syncing…" : "↻ Reload"}
        </button>

      </div>

      {/* Filter tabs */}
      <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: "1.25rem", alignItems: "center" }}>
        <button onClick={() => setFilters(new Set())} style={{
          padding: "5px 12px", borderRadius: 20, fontSize: 12,
          border: "1px solid", cursor: "pointer",
          borderColor: filters.size === 0 ? "#1a1916" : "#e2e0d8",
          background: filters.size === 0 ? "#1a1916" : "#fff",
          color: filters.size === 0 ? "#f5f2ec" : "#666",
          fontFamily: "Georgia, serif", transition: "all 0.15s",
        }}>All</button>
        {Object.entries(CATEGORY_CONFIG).map(([k, v]) => {
          const active = filters.has(k);
          return (
            <button key={k} onClick={() => setFilters(prev => {
              const next = new Set(prev);
              if (next.has(k)) next.delete(k); else next.add(k);
              return next;
            })} style={{
              padding: "5px 12px", borderRadius: 20, fontSize: 12,
              border: "1px solid", cursor: "pointer",
              borderColor: active ? "#1a1916" : "#e2e0d8",
              background: active ? "#1a1916" : "#fff",
              color: active ? "#f5f2ec" : "#666",
              fontFamily: "Georgia, serif", transition: "all 0.15s",
            }}>{v.icon} {v.label}</button>
          );
        })}
      </div>

      {/* Itinerary */}
      {filteredItems.length === 0 ? (
        <div style={{
          textAlign: "center", padding: "3rem 1rem",
          border: "1.5px dashed #d9d4c7", borderRadius: 16, color: "#aaa",
        }}>
          <div style={{ fontSize: 32, marginBottom: 8 }}>🗺️</div>
          <div style={{ fontFamily: "'Playfair Display', Georgia, serif", fontSize: 18, marginBottom: 6, color: "#888" }}>
            {items.length === 0 ? "Start planning your adventure" : "No items match your filter"}
          </div>
          <div style={{ fontSize: 13 }}>
            {items.length === 0 ? "Add flights, hotels, activities and more" : "Try a different filter or search term"}
          </div>
        </div>
      ) : (
        <div>
          {grouped.map(([dateKey, dayItems]) => (
            <CollapsibleDay key={dateKey} dateKey={dateKey} dayItems={dayItems} onEdit={handleEdit} onDelete={handleDelete} />
          ))}
        </div>
      )}


    </div>
  );
}


    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(EuropeTripPlanner));
  </script>
</body>
</html>
